<!DOCTYPE html>
<html>
<head>
    <title>Green Box Gravity Test</title>
    <style>
        body { 
            background-color: #222; 
            color: white; 
            font-family: sans-serif;
            overflow: hidden; /* No scrollbars */
        }
    </style>
</head>
<body>

    <h1>Status: <span id="status">Waiting for JS...</span></h1>

    <script>
        // 1. UPDATE STATUS
        const statusSpan = document.getElementById('status');
        statusSpan.innerText = "Initializing...";

        // 2. CREATE THE BOX
        const box = document.createElement('div');
        
        // strict styling to force visibility
        box.style.width = "150px";
        box.style.height = "150px";
        box.style.backgroundColor = "#00FF00"; // NEON GREEN
        box.style.position = "absolute";
        box.style.top = "50%";     // Center vertical
        box.style.left = "50%";    // Center horizontal
        box.style.transform = "translate(-50%, -50%)"; // Perfect center
        box.style.cursor = "pointer";
        box.style.zIndex = "9999";
        
        document.body.appendChild(box);
        statusSpan.innerText = "Green Box Created. HOVER TO DROP.";

        // 3. ADD GRAVITY LOGIC
        box.addEventListener('mouseenter', function() {
            statusSpan.innerText = "Gravity Activated!";
            
            let posY = window.innerHeight / 2; // Start at vertical center
            let velocityY = 0;
            let gravity = 1.5; // Heavy gravity

            function drop() {
                velocityY += gravity; // Increase speed
                posY += velocityY;    // Move down
                
                box.style.top = posY + "px";

                // If still on screen, keep dropping
                if (posY < window.innerHeight + 200) {
                    requestAnimationFrame(drop);
                } else {
                    statusSpan.innerText = "Box fell off screen. Refresh to reset.";
                    box.remove();
                }
            }
            
            // Start the drop
            requestAnimationFrame(drop);
        });
    </script>
</body>
</html>
